<body style="background: #000000;color: #ffffff;width: 95%;margin: auto;">
    <section>
        <section style="height: 15vh;background: url(&quot;assets/img/alexander-slattery-LI748t0BK8w-unsplash.webp&quot;) bottom / cover no-repeat;min-height: 130px;"></section>
        <section class="d-print-none d-lg-none d-xl-none d-xxl-none" style="width: 30vw;border-radius: 50%;background: #000000;padding: 20px;height: 30vw;margin: auto;margin-top: -15vw;display: flex;"><a href="/"><img class="img-fluid" src="assets/img/HNSW.png" width="100%"></a></section>
        <section class="d-print-none d-lg-none d-xl-none d-xxl-none" style="display: block;width: 100%;text-align: center;margin-top: 10px;">
            <div style="display: inline-block;margin: auto;"><a class="btn btn-primary" role="button" style="margin: 10px;" href="/signup">Create your page</a><a class="btn btn-primary" role="button" style="margin: 10px;" href="/{{account_link}}">{{account_link_name}}</a></div>
        </section>
        <section class="d-none d-print-block d-lg-block d-xl-block d-xxl-block" style="display: block;">
            <div style="width: 100%;text-align: right;margin-top: -4em;"><a class="btn btn-primary" role="button" style="margin: 10px;" href="/signup">Create a new page</a><a class="btn btn-primary" role="button" style="margin: 10px;" href="/{{account_link}}">{{account_link_name}}</a></div>
        </section>
        <section class="d-none d-print-block d-lg-block d-xl-block d-xxl-block" style="width: 15vw;border-radius: 50%;background: #000000;padding: 20px;height: 15vw;margin: auto;display: flex;margin-top: -6vw;"><a href="/"><img class="img-fluid" src="assets/img/HNSW.png" width="100%"></a></section>
        <section class="d-none d-print-block d-lg-block d-xl-block d-xxl-block" style="height: 3em;"></section>
    </section>
    <section style="margin-top: 50px;">
        <h1 style="text-align: center;margin-bottom: 30px;">Edit your page</h1>
    </section>
    <section style="width: 80%;margin: auto;">
        <form action="/upload" method="post" enctype="multipart/form-data" class="text-center" style="margin-bottom: 30px;">
            <div style="margin-bottom: 15px;">
                {{avatar|safe}}
            </div>
            <div class="d-flex justify-content-center align-items-center flex-wrap gap-2">
                <label class="form-label mb-0" style="font-weight: bold; margin-right: 5px;">Avatar</label>
                <input class="form-control" type="file" style="width: auto; max-width: 320px; display: inline-block;" name="file" accept="image/*" required="">
                <input class="btn btn-primary" type="submit" value="Upload">
                <a class="btn btn-primary" role="button" href="/avatar/clear">Clear</a>
            </div>
        </form>
        <form class="text-center" method="post">
            <div style="max-width: 900px; margin: auto;">
                <input class="form-control" type="text" style="margin-top: 10px;" name="location" value="{{location}}" placeholder="Location">
                <input class="form-control" type="text" style="margin-top: 10px;" name="hnschat" placeholder="HNSChat" value="{{hnschat}}">
                <input class="form-control" type="text" style="margin-top: 10px;" name="email" placeholder="Public Email" value="{{email}}">
            </div>
            <div class="d-xl-flex justify-content-xl-center align-items-xl-center" style="margin-bottom: 10px;margin-top: 10px;"><label class="form-label" style="display: inline-block;margin-right: 15px;">Background colour&nbsp;</label><input class="form-control form-control-color" type="color" style="display: inline-block;border-radius: 50%;width: 50px;height: 50px;" name="bg_colour" value="{{bg_colour}}"></div>
            <div class="d-xl-flex justify-content-xl-center align-items-xl-center" style="margin-bottom: 10px;margin-top: 10px;"><label class="form-label" style="display: inline-block;margin-right: 15px;">Foreground colour&nbsp;</label><input class="form-control form-control-color" type="color" style="display: inline-block;border-radius: 50%;width: 50px;height: 50px;" name="fg_colour" value="{{fg_colour}}"></div>
            <div class="d-xl-flex justify-content-xl-center align-items-xl-center" style="margin-bottom: 10px;margin-top: 10px;"><label class="form-label" style="display: inline-block;margin-right: 15px;">Text colour&nbsp;</label><input class="form-control form-control-color" type="color" style="display: inline-block;border-radius: 50%;width: 50px;height: 50px;" name="text_colour" value="{{text_colour}}"></div>

            <div class="editor-wrapper">
                <div class="editor-mode-toggle">
                    <label class="form-label mb-0" style="font-weight: bold; font-size: 1.1rem; color: #ffffff;">Website Content</label>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Editor Mode">
                        <button type="button" class="btn btn-primary active" id="btn-visual-mode">Visual Editor</button>
                        <button type="button" class="btn btn-outline-light" id="btn-code-mode">HTML Code</button>
                    </div>
                </div>

                <!-- Visual Quill Editor -->
                <div id="visual-editor-container">
                    <div id="editor">{{ data | safe }}</div>
                </div>

                <!-- Raw HTML Code Editor -->
                <div id="code-editor-container" style="display: none; width: 100%;">
                    <div style="background: #2d2d2d; color: #ccc; font-size: 12px; padding: 6px 12px; border-top-left-radius: 6px; border-top-right-radius: 6px; border: 1px solid #555; border-bottom: none; display: flex; justify-content: space-between; align-items: center;">
                        <span>HTML Source Code</span>
                        <span style="font-size: 11px; opacity: 0.8;">You can write raw HTML, embed widgets, or paste markup</span>
                    </div>
                    <textarea id="raw_html_code" class="form-control" rows="15" style="background: #1e1e1e; color: #f8f8f2; font-family: SFMono-Regular, Consolas, Menlo, Monaco, 'Courier New', monospace; font-size: 14px; border: 1px solid #555; border-top-left-radius: 0; border-top-right-radius: 0; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; width: 100% !important; min-height: 320px; tab-size: 2;" placeholder="Write raw HTML content here...">{{ data }}</textarea>
                </div>

                <!-- Hidden input that submits the HTML to Flask -->
                <input type="hidden" id="html_content" name="data">
            </div>

            <script>
              var quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                  toolbar: {
                    container: [
                      [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                      ['bold', 'italic', 'underline', 'strike'],
                      [{ 'color': [] }, { 'background': [] }],
                      [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                      [{ 'align': [] }],
                      ['link', 'image', 'blockquote', 'code-block'],
                      ['clean']
                    ],
                    handlers: {
                      'code-block': function() {
                        toggleMode();
                      }
                    }
                  }
                }
              });

              var currentMode = 'visual';
              var btnVisual = document.getElementById('btn-visual-mode');
              var btnCode = document.getElementById('btn-code-mode');
              var visualContainer = document.getElementById('visual-editor-container');
              var codeContainer = document.getElementById('code-editor-container');
              var rawCode = document.getElementById('raw_html_code');
              var hiddenInput = document.getElementById('html_content');
              var codeBlockBtn = document.querySelector('.ql-code-block');

              if (codeBlockBtn) {
                codeBlockBtn.setAttribute('title', 'Toggle HTML Code View');
              }

              var quillModified = false;
              quill.on('text-change', function() {
                quillModified = true;
              });

              function setMode(mode) {
                if (mode === currentMode) return;
                currentMode = mode;

                if (currentMode === 'code') {
                  btnCode.classList.add('btn-primary', 'active');
                  btnCode.classList.remove('btn-outline-light');
                  btnVisual.classList.remove('btn-primary', 'active');
                  btnVisual.classList.add('btn-outline-light');
                  if (codeBlockBtn) codeBlockBtn.classList.add('ql-active');

                  if (quillModified) {
                    var html = quill.root.innerHTML;
                    if (html === '<p><br></p>') {
                      html = '';
                    }
                    rawCode.value = html;
                  } else if (!rawCode.value && quill.root.innerHTML !== '<p><br></p>') {
                    rawCode.value = quill.root.innerHTML;
                  }

                  visualContainer.style.display = 'none';
                  codeContainer.style.display = 'block';
                  rawCode.focus();
                } else {
                  btnVisual.classList.add('btn-primary', 'active');
                  btnVisual.classList.remove('btn-outline-light');
                  btnCode.classList.remove('btn-primary', 'active');
                  btnCode.classList.add('btn-outline-light');
                  if (codeBlockBtn) codeBlockBtn.classList.remove('ql-active');

                  quill.root.innerHTML = rawCode.value;
                  quillModified = false;

                  codeContainer.style.display = 'none';
                  visualContainer.style.display = 'block';
                }
              }

              function toggleMode() {
                setMode(currentMode === 'visual' ? 'code' : 'visual');
              }

              btnVisual.addEventListener('click', function() {
                setMode('visual');
              });

              btnCode.addEventListener('click', function() {
                setMode('code');
              });

              // Attach submit listener specifically to the form containing the hidden input
              var form = hiddenInput.closest('form');
              if (form) {
                form.addEventListener('submit', function() {
                  if (currentMode === 'code') {
                    hiddenInput.value = rawCode.value;
                  } else {
                    var html = quill.root.innerHTML;
                    if (html === '<p><br></p>') {
                      html = '';
                    }
                    hiddenInput.value = html;
                  }
                });
              }
            </script>

            <div class="text-center">
                <div><input class="form-control" type="text" style="margin-top: 10px;display: inline-block;width: 100%;max-width: 500px;" placeholder="HNS Address" name="hns" value="{{hns}}" pattern="hs1[A-Za-z0-9]+"><div class="form-check form-switch form-check-inline" style="display: inline-block;margin-left: 10px;">
    <input id="formCheck-1" class="form-check-input" type="checkbox" {% if hip2_display %}checked{% endif %} name="hip2_display" />
    <label class="form-check-label" for="formCheck-1">Show as @{{domain}}.{{CITY_DOMAIN}}</label>
</div>
</div>
                <div><input class="form-control" type="text" style="margin-top: 10px;width: 100%;max-width: 500px;display: inline-block;" name="btc" placeholder="BTC Address" value="{{btc}}"></div>
                <div><input class="form-control" type="text" style="margin-top: 10px;width: 100%;max-width: 500px;display: inline-block;" placeholder="ETH Address" name="eth" value="{{eth}}" pattern="0x[A-Za-z0-9]+"></div>
            </div>
            <div style="margin-top: 10px;display: inline-block;"><label class="form-label" style="margin-right: 25px;">Template</label><select class="form-select" id="template" name="template" style="width:auto;display:inline-block;">
            {% for template in templates %}
                <option value="{{ template }}" {% if template == selected_template %}selected{% endif %}>{{ template }}</option>
            {% endfor %}
</select></div>
            <div style="text-align: center;"><input class="btn btn-primary" type="submit" style="margin-top: 10px;"></div>
        </form>
    </section>
    <section style="margin: 20px;height: 40px;text-align: center;margin-top: 40px;">
        <footer class="text-center bg-dark"></footer>
        <div style="display: inline-block;">
            <ul class="list-inline">
                <li class="list-inline-item me-4" style="color: rgb(255,255,255);">Copyright © ShakeCities 2023</li>
            </ul>
        </div>
    </section>

    <script src="assets/js/script.min.js"></script>
